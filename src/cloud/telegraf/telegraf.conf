# Telegraf: liest alle Gruppen vom Kurs-Broker und schreibt nach InfluxDB.
# Neue Gruppen werden ueber die Wildcard "+" automatisch aufgenommen.

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# ------------------------------------------------------------------
# Temperatur: iiot/group/{group}/sensor/temperature/state
# Payload laut asyncapi.yaml: {"timestamp": "...", "value": 22.5, "unit": "°C"}
# Ungueltige Payloads werden geloggt und verworfen, Telegraf laeuft weiter.
# ------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  topics = ["iiot/group/+/sensor/temperature/state"]
  qos = 0
  topic_tag = ""
  name_override = "temperature"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iiot/group/+/sensor/temperature/state"
    tags = "_/_/group/_/_/_"

  # Zeitstempel = Empfangszeit. Der Geraete-Zeitstempel waere bei
  # Geraeten ohne NTP-Sync (1970/2000) unbrauchbar.
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "unit"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sensor_id"
      type = "string"
      optional = true

# ------------------------------------------------------------------
# Geraetestatus: iiot/group/{group}/status (retained)
# Rohtext einlesen, damit auch abweichende Payloads (z.B. "ok" statt
# {"status": "ok"}) ankommen. Normalisierung in status.star.
# ------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  topics = ["iiot/group/+/status"]
  qos = 1
  topic_tag = ""
  name_override = "device_status"
  data_format = "value"
  data_type = "string"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "iiot/group/+/status"
    tags = "_/_/group/_"

[[processors.starlark]]
  namepass = ["device_status"]
  script = "/etc/telegraf/status.star"

# ------------------------------------------------------------------
# Ausgabe
# ------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
